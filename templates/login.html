<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #e8eefc 0%, #f6f8ff 100%);
    }
    .signin-card { max-width: 420px; width: 100%; border: 0; border-radius: 1rem; }
  </style>
</head>
<body>

  <main class="container py-4">
    <div class="card signin-card shadow mx-auto">
      <div class="card-body p-4 p-md-5">

        <h1 class="h3 fw-bold text-center mb-1">Welcome back</h1>
        <p class="text-center text-muted mb-4">Sign in to your account</p>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-danger" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <form id="signinForm" class="needs-validation" novalidate method="post" action="/login">
          {% csrf_token %}

          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
            <label for="username">User name</label>
            <div class="invalid-feedback">Enter your user name.</div>
          </div>

          <div class="input-group mb-3 has-validation">
            <div class="form-floating flex-grow-1">
              <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
              <label for="password">Password</label>
            </div>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">Show</button>
            <div class="invalid-feedback">Enter your password.</div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember">
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <a href="#" class="small text-decoration-none">Forgot password?</a>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
          </div>
        </form>

        <div class="text-center text-muted my-3">or</div>

        <div class="d-grid gap-2">
          <button type="button" class="btn btn-outline-dark">Continue with Google</button>
          <button type="button" class="btn btn-outline-dark">Continue with Facebook</button>
        </div>

        <p class="text-center mt-4 mb-0">
          Don't have an account? <a href="#" class="text-decoration-none">Create one</a>
        </p>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Show / hide password
    const pwd = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');
    toggle.addEventListener('click', () => {
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Hide' : 'Show';
    });

    // Bootstrap validation: sirf invalid hone par submit rokta hai
    const form = document.getElementById('signinForm');
    form.addEventListener('submit', (e) => {
      if (!form.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
      }
      form.classList.add('was-validated');
    });
  </script>
</body>
</html>
